<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}{% if page.title %} | {{ page.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@500;700&family=Galada&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/images/logo-icon.png">
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
{% include header.html %}
<main id="top">
{{ content }}
</main>
<a class="float" id="float" href="#order">View slip (<span id="fcount">0</span>)</a>
<div class="alpona" aria-hidden="true"></div>
{% include footer.html %}
<script>
/* Data from _data/store.yml and _data/products.yml, handed to assets/js/main.js */
window.SITE = {
  whatsapp: {{ site.data.store.whatsapp | jsonify }},
  products: {{ site.data.products | jsonify }}
};
</script>
<script src="assets/js/main.js"></script>
</body>
</html>
