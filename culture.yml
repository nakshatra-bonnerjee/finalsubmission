# Festivals shown in the "Our festivals" section.
- {bn: পয়লা বৈশাখ, en: Poila Boishakh, when: April, text: "The Bengali New Year. Shops traditionally open a fresh halkhata ledger, and neighbours drop in with greetings and sweets."}
- {bn: দুর্গাপুজো, en: Durga Puja, when: September to October, text: "The biggest festival of Bengal, with pandals, dhak drums, new clothes and a house full of guests."}
- {bn: লক্ষ্মীপুজো, en: Lakshmi Puja, when: October, text: "A quiet evening puja, with alpona on the floor and lamps lit at the doorway."}
- {bn: কালীপুজো, en: Kali Puja, when: October to November, text: "The night of lamps, candles and fireworks, when the whole para is lit up."}
- {bn: সরস্বতী পুজো, en: Saraswati Puja, when: January to February, text: "Students place their books and pens at the goddess’s feet, and the day is spent dressed in yellow."}
- {bn: পৌষ সংক্রান্তি, en: Poush Sankranti, when: January, text: "The harvest festival of pithe and puli, made with new rice and date-palm jaggery."}
